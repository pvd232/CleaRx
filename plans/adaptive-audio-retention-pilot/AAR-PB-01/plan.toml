schema_version = 1
contract_id = "adaptive-audio-retention-pilot"
package_sha256 = "a12080859632efd07b093d00bed0d29256161ef511cdc734968bd43e5c9dc125"
pair_block_id = "AAR-PB-01"
baseline_commit = "a074c895d29bdc7ec64c5bba122246d9c1a407b9"
change_summary = [
  "Add chronological pooling and a held-speaker ridge policy that predicts the benefit of four acoustic positions.",
  "Add an A100 runner that preserves transcript positions and measures 0, 2, and 4 appended acoustic positions with alpha fixed at one.",
  "Add focused counterexample tests and a VIPER diagnostic that recomputes the retained model, allocation, budgets, and metrics.",
]
deviation_summary = "The pilot allocates across independent RAVDESS items rather than among several transcript segments in one prompt. It establishes the allocation signal and equal-budget comparison without claiming end-to-end context-window savings."

