schema_version = 1
contract_id = "crossed-audio-retention-pilot"
title = "Crossed Audio Retention Pilot"

[[requirements]]
id = "CAR-REQ-01"
claim = "Freeze the complete 72-item product of six speakers, two recordings, three transcript conditions, and clean and degraded audio, with alpha 1 and acoustic-position counts 0, 2, and 4."
depends_on = []
verifier_ids = ["CAR-VR-01"]

[[requirements]]
id = "CAR-REQ-02"
claim = "Preserve every transcript embedding and append exactly the requested number of chronological mean-pooled acoustic positions."
depends_on = ["CAR-REQ-01"]
verifier_ids = ["CAR-VR-02"]

[[requirements]]
id = "CAR-REQ-03"
claim = "Compare fixed, agreement-adaptive, audio-only-adaptive, and oracle allocations on held-out speakers at the same aggregate acoustic and input-position budgets, with recording-clustered uncertainty."
depends_on = ["CAR-REQ-02"]
verifier_ids = ["CAR-VR-03"]

[[requirements]]
id = "CAR-REQ-04"
claim = "Retain one VIPER run that observes the A100 measurement stage, binds its result bytes, and recomputes both learned policies, every allocation, budget, contrast, cell summary, and bootstrap value in a separate verification stage."
depends_on = ["CAR-REQ-03"]
verifier_ids = ["CAR-VR-04"]

[[verifiers]]
id = "CAR-VR-01"
requirement_ids = ["CAR-REQ-01"]
acceptance_conditions = [
  "Every speaker and recording contains all six transcript-by-audio cells, actors 01 through 04 form the training split, and actors 05 and 06 form the held-out split.",
  "The model, Transformers revision, dataset archive, selected WAV digests, prompt, noise transform, alpha, and position grid equal their frozen values.",
]
success_case = { repository_id = "clearx", path = "tests/unit/test_crossed_audio_retention.py", symbol = "test_frozen_protocol_is_complete_crossed_product" }
rejection_cases = [
  { repository_id = "clearx", path = "tests/unit/test_crossed_audio_retention.py", symbol = "test_payload_rejects_missing_crossed_cell_and_wrong_audio_hash" },
]

[[verifiers]]
id = "CAR-VR-02"
requirement_ids = ["CAR-REQ-02"]
acceptance_conditions = [
  "The shared candidate assembler retains the transcript array byte-for-byte and appends exactly zero, two, or four acoustic rows.",
  "The A100 stage asserts the same transcript slice before invoking the Thinker.",
]
success_case = { repository_id = "clearx", path = "tests/unit/test_crossed_audio_retention.py", symbol = "test_candidate_assembly_preserves_transcript_embeddings" }
rejection_cases = [
  { repository_id = "clearx", path = "tests/unit/test_crossed_audio_retention.py", symbol = "test_candidate_assembly_rejects_incompatible_parts" },
]

[[verifiers]]
id = "CAR-VR-03"
requirement_ids = ["CAR-REQ-03"]
acceptance_conditions = [
  "Both learned policies fit only actors 01 through 04 and never read held-out KL values during allocation.",
  "The audio-only policy uses one score per recording and audio-quality group and selects complete three-transcript groups.",
  "All four policies spend 48 acoustic positions and the same aggregate input positions across the 24 held-out items.",
  "The result contains per-recording and per-actor contrasts plus all 256 deterministic recording-cluster bootstrap means for both primary comparisons.",
]
success_case = { repository_id = "clearx", path = "tests/unit/test_crossed_audio_retention.py", symbol = "test_crossed_payload_compares_equal_budget_policies" }
rejection_cases = [
  { repository_id = "clearx", path = "tests/unit/test_crossed_audio_retention.py", symbol = "test_learned_allocations_ignore_held_out_labels" },
]

[[verifiers]]
id = "CAR-VR-04"
requirement_ids = ["CAR-REQ-04"]
acceptance_conditions = [
  "The measurement result names the exact run-source commit and reports the CUDA device and compute capability observed by VIPER.",
  "VIPER supplies the measurement artifact directly to the verification stage and the verification report records its SHA-256 digest.",
  "The retained Git audit archive contains every run, stage, attempt, invocation, journal, log, artifact, measurement, and verification record referenced by the terminal result.",
]
success_case = { repository_id = "clearx", path = "tests/unit/test_crossed_audio_retention.py", symbol = "test_result_validation_binds_commit_hardware_and_recomputed_payload" }
rejection_cases = [
  { repository_id = "clearx", path = "tests/unit/test_crossed_audio_retention.py", symbol = "test_result_validation_rejects_provenance_and_metric_tampering" },
]

[[pair_blocks]]
id = "CAR-PB-01"
requirement_ids = ["CAR-REQ-01", "CAR-REQ-02", "CAR-REQ-03", "CAR-REQ-04"]
depends_on = []
repository_id = "clearx"
requirement_contribution = "Add the crossed policy analysis, guarded A100 runner, focused counterexamples, and two-stage VIPER execution path."
completion_evidence = ["implementation_review", "viper_registration"]
